<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova senha - Green Day</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
</head>
<body>
<main class="login-page">
    <div class="background"></div>
    <div class="login-container">
        <div class="logo"><span>GREEN</span><span>DAY</span></div>
        <div class="login-card">
            <h1>Nova senha</h1>
            <p class="subtitle">Escolha uma nova senha para sua conta.</p>
            <p th:if="${erro}" th:text="${erro}" class="mensagem-erro"></p>
            <form th:action="@{/redefinir-senha}" method="post">
                <input type="hidden" name="token" th:value="${token}">
                <div class="input-group">
                    <label for="senha">Nova senha</label>
                    <input id="senha" name="senha" type="password" minlength="6" required>
                </div>
                <div class="input-group">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input id="confirmarSenha" name="confirmarSenha" type="password" minlength="6" required>
                </div>
                <button type="submit" class="btn-login">Salvar nova senha</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
