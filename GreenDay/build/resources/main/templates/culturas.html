<!DOCTYPE html><html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GreenDay | Culturas</title><link rel="stylesheet" th:href="@{/css/index.css}"></head><body>
<nav th:replace="~{fragments/nav :: nav}"></nav><main class="container"><section class="page-hero compact-hero"><div><span class="eyebrow-page">PLANEJAMENTO AGRÍCOLA</span><h1>🌱 Culturas</h1><p>Registre o que está sendo cultivado na propriedade selecionada.</p></div><button id="btn-nova-cultura" class="btn-primary">＋ Nova cultura</button></section>
<div class="context-bar" id="context-cultura">🏡 Carregando propriedade...</div><div class="tabela-container"><table id="tabela-culturas"><thead><tr><th>Nome</th><th>Variedade</th><th>Plantio</th><th>Previsão de colheita</th><th>Área (ha)</th><th>Ações</th></tr></thead><tbody></tbody></table></div></main>
<div id="modal-cultura" class="modal-backdrop hidden"><div class="modal-card"><div class="modal-head"><div><span class="eyebrow-page">CULTURA</span><h2 id="cultura-modal-titulo">Cadastrar cultura</h2></div><button type="button" class="modal-close" data-close="modal-cultura">×</button></div><form id="form-cultura"><input type="hidden" id="cultura-id"><div class="form-grid"><div class="field-full"><label>Nome da cultura <b>*</b></label><input id="cultura-nome" required placeholder="Ex.: Milho"></div><div><label>Variedade</label><input id="cultura-variedade" placeholder="Ex.: Milho doce"></div><div><label>Área ocupada (ha)</label><input id="cultura-area" type="number" min="0" step=".01"></div><div><label>Data do plantio</label><input id="cultura-plantio" type="date"></div><div><label>Previsão de colheita</label><input id="cultura-colheita" type="date"></div></div><div class="modal-actions"><button type="button" class="btn-secondary" data-close="modal-cultura">Cancelar</button><button type="submit" class="btn-primary">Salvar cultura 🌱</button></div></form></div></div>
<script th:src="@{/js/common.js}"></script><script th:src="@{/js/culturas.js}"></script><script th:src="@{/js/nav.js}"></script><script th:src="@{/js/app.js}"></script></body></html>
