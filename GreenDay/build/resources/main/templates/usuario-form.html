<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Day - Editar usuário</title>
    <link rel="stylesheet" th:href="@{/css/Usuario.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container form-page">
    <div class="card form-card">
        <h1>Editar usuário</h1>
        <p>Atualize os dados da conta.</p>

        <form th:action="@{/usuarios/salvar}" method="post" class="usuario-form">
            <input type="hidden" name="id" th:value="${usuario.id}">

            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" th:value="${usuario.nome}" required>

            <label for="email">E-mail</label>
            <input id="email" type="email" th:value="${usuario.email}" disabled>

            <label for="telefone">Telefone</label>
            <input id="telefone" name="telefone" type="text" th:value="${usuario.telefone}">

            <label for="role">Perfil</label>
            <select id="role" name="role" required>
                <option th:each="r : ${roles}"
                        th:value="${r}"
                        th:text="${r}"
                        th:selected="${r == usuario.role}">
                </option>
            </select>

            <div class="form-actions">
                <a th:href="@{/usuarios}" class="btn-voltar">Cancelar</a>
                <button type="submit" class="btn-salvar">Salvar alterações</button>
            </div>
        </form>
    </div>
</main>
<script th:src="@{/js/nav.js}"></script>
<script th:src="@{/js/app.js}"></script></body>
</html>
