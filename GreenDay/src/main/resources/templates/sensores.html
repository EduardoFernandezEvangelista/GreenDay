<!DOCTYPE html><html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GreenDay | Sensores</title><link rel="stylesheet" th:href="@{/css/index.css}"></head><body><nav th:replace="~{fragments/nav :: nav}"></nav><main class="container"><section class="page-hero compact-hero"><div><span class="eyebrow-page">MONITORAMENTO</span><h1>📡 Sensores</h1><p>Cadastre dispositivos e acompanhe os dados coletados no campo.</p></div><button id="btn-novo-sensor" class="btn-primary">＋ Cadastrar sensor</button></section><div class="context-bar" id="context-sensor">🏡 Selecione uma propriedade</div><div id="lista-sensores" class="cards-grid"></div></main>
<div id="modal-sensor" class="modal-backdrop hidden"><div class="modal-card"><div class="modal-head"><div><span class="eyebrow-page">DISPOSITIVO</span><h2 id="sensor-modal-titulo">Cadastrar sensor</h2></div><button class="modal-close" type="button" data-close="modal-sensor">×</button></div><form id="form-sensor"><input type="hidden" id="sensor-id"><div class="form-grid"><div class="field-full"><label>Nome <b>*</b></label><input id="sensor-nome" required placeholder="Ex.: Sensor de umidade 01"></div><div><label>Tipo <b>*</b></label><select id="sensor-tipo" required><option value="UMIDADE_SOLO">Umidade do solo</option><option value="TEMPERATURA">Temperatura</option><option value="LUMINOSIDADE">Luminosidade</option><option value="PH_SOLO">pH do solo</option><option value="CHUVA">Chuva</option></select></div><div><label>Unidade de medida</label><input id="sensor-unidade" placeholder="Ex.: %, °C, lux"></div></div><div class="modal-actions"><button type="button" class="btn-secondary" data-close="modal-sensor">Cancelar</button><button type="submit" class="btn-primary">Salvar sensor 📡</button></div></form></div></div>
<script th:src="@{/js/common.js}"></script><script th:src="@{/js/sensores.js}"></script><script th:src="@{/js/nav.js}"></script><script th:src="@{/js/app.js}"></script></body></html>
